name: CI Pipeline & Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter-quality-and-tests:
    name: Flutter Lint, Format & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Quality Gate 1 - Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Quality Gate 2 - Static Analysis (Linter)
        run: flutter analyze

      - name: Quality Gate 3 - Unit & Widget Tests
        run: flutter test --coverage

  firestore-rules-security-tests:
    name: Cloud Firestore Security Rules Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17 (Required for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Rules Test Dependencies
        run: |
          cd test_rules
          npm ci

      - name: Quality Gate 4 - Firestore Security Rules Unit Tests
        run: |
          firebase emulators:exec --only firestore "npm --prefix test_rules test"
